<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Library Scanner</title>
    <!-- Quagga2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>📚 Book Scanner</h1>

    <div id="reader">
        <div class="scan-guide"></div>
    </div>

    <div class="scanned-list">
        <h3>Scanned Books (<span id="count">0</span>)</h3>
        <ul id="isbn-list">
        </ul>
    </div>

    <!-- Start Scanner Overlay -->
    <div id="start-overlay"
        style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:2000; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <h1 style="margin-bottom:10px;">📚 Church Library Scanner</h1>
        <p style="color:#666; margin-bottom:30px; text-align:center; max-width:80%;">Click start to enable the camera.
        </p>
        <button onclick="startScanner()"
            style="padding:15px 40px; font-size:1.2em; background:#007bff; color:white; border:none; border-radius:30px; margin-top:20px; box-shadow:0 4px 10px rgba(0,123,255,0.3); width:auto;">Start
            Scanner ▶️</button>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:white; padding:20px; border-radius:10px; max-width:90%; width:400px; text-align:center;">
            <p id="modal-title" style="margin-top:0; font-weight:bold; font-size:1.2em;">Book Found!</p>
            <img id="modal-cover" src="" style="max-height:150px; margin:10px 0; display:none;">
            <p id="modal-author" style="color:#666; margin-bottom:15px; font-size:0.9em;"></p>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button onclick="confirmScan(true)" style="background:#28a745; color:white; width:auto;">Add
                    Book</button>
                <button onclick="confirmScan(false)"
                    style="background:#dc3545; color:white; width:auto;">Cancel</button>
            </div>
        </div>
    </div>

    <br>

    <div class="btn-group">
        <button class="btn-export" onclick="exportToCSV()">📥 Download CSV</button>
        <button class="btn-clear" onclick="clearList()">🗑️ Clear List</button>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
